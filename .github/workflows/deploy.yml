name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Cache Astro images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('bun.lock', 'astro.config.mjs', 'content/posts/**/*.avif', 'content/posts/**/*.gif', 'content/posts/**/*.jpeg', 'content/posts/**/*.jpg', 'content/posts/**/*.png', 'content/posts/**/*.svg', 'content/posts/**/*.webp') }}
          restore-keys: |
            ${{ runner.os }}-astro-
      - run: bun run build
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
