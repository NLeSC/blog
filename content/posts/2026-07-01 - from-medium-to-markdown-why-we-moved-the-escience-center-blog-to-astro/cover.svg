<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Markdown blog workflow cover image</title>
  <desc id="desc">A simple workflow from Markdown to Git, Astro, and static blog pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152f" />
      <stop offset="0.58" stop-color="#003388" />
      <stop offset="1" stop-color="#092218" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.24" />
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 10 6 2 10Z" fill="#b9dcff" />
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="280" cy="520" r="190" fill="#ffffff" opacity="0.07" />
  <circle cx="935" cy="150" r="170" fill="#1a8917" opacity="0.16" />

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(250 214)">
      <rect width="180" height="160" rx="24" fill="#ffffff" />
      <text x="90" y="54" text-anchor="middle" font-size="24" font-weight="800" fill="#003388">Markdown</text>
      <rect x="48" y="78" width="84" height="12" rx="6" fill="#d8d8d8" />
      <rect x="48" y="104" width="104" height="12" rx="6" fill="#d8d8d8" />
      <rect x="48" y="130" width="72" height="12" rx="6" fill="#d8d8d8" />
    </g>

    <g transform="translate(510 214)">
      <rect width="180" height="160" rx="24" fill="#f7fbff" />
      <text x="90" y="54" text-anchor="middle" font-size="24" font-weight="800" fill="#242424">Git</text>
      <circle cx="90" cy="103" r="34" fill="#003388" />
      <path d="M78 103h24M90 91v24" stroke="#fff" stroke-width="8" stroke-linecap="round" />
    </g>

    <g transform="translate(770 214)">
      <rect width="180" height="160" rx="24" fill="#eff8f0" />
      <text x="90" y="54" text-anchor="middle" font-size="24" font-weight="800" fill="#1a8917">Astro</text>
      <path d="M90 76 128 144H52Z" fill="#1a8917" opacity="0.92" />
      <path d="M90 96 108 130H72Z" fill="#eff8f0" />
    </g>
  </g>

  <g fill="none" stroke="#b9dcff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M452 294H492" />
    <path d="M712 294H752" />
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="600" y="468" font-size="34" font-weight="800" letter-spacing="-0.5">Plain files to static pages</text>
    <text x="600" y="506" font-size="20" fill="#d8e8ff">Reviewable content, repeatable builds, public hosting</text>
  </g>
</svg>
